<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Swarm Baseball</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/swarm-badge.png') }}">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="{{ url_for('static', filename='img/swarm-badge.png') }}" alt="Swarm Baseball logo" class="login-logo">
      <h1>Reset Password</h1>
      <p class="login-sub">Enter the email or phone number on your account and we'll send you a 6-digit code.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="field">
          <label for="identifier">Email or phone number</label>
          <input type="text" id="identifier" name="identifier" autocomplete="username" autofocus required>
        </div>
        <button class="btn" type="submit" style="width:100%;">Send Code</button>
      </form>
      <p style="margin-top:14px; font-size:0.85rem;"><a href="{{ url_for('login') }}">Back to sign in</a></p>
    </div>
  </div>
</body>
</html>
