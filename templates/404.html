<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - {{ platform_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&family=Poppins:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <link rel="icon" href="{{ static_url('img/favicon.svg') }}">
  <link rel="alternate icon" href="{{ static_url('img/favicon.ico') }}">
</head>
<body>
  <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;">
    <img src="{{ static_url('img/default-badge.svg') }}" alt="{{ platform_name }} logo" style="height:56px; width:56px; margin-bottom:18px;">
    <h1 style="font-family:var(--font-display); font-size:2.2rem; color:var(--phx-blue); margin:0 0 8px;">Page not found</h1>
    <p style="color:var(--phx-gray); max-width:420px; margin:0 0 24px;">
      That page doesn't exist, or you might not have access to it. Double-check the link, or head back home.
    </p>
    <a class="btn" href="{{ url_for('home') }}">Back to {{ platform_name }}</a>
  </div>
</body>
</html>
