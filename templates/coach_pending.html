<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approval - Recruiting Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Poppins:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/default-badge.svg') }}">
  <link rel="alternate icon" href="{{ static_url('img/favicon.ico') }}">
  <style>
    :root {
      --phx-blue: #4338ca;
      --phx-blue-dark: #312e81;
      --phx-orange: #a5b4fc;
      --phx-orange-dark: #818cf8;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="{{ url_for('static', filename='img/default-badge.svg') }}" alt="Recruiting Portal" class="login-logo">
      <h1>Almost there, {{ coach['name'] }}</h1>
      <p class="login-sub">Your account is still waiting on approval. We'll let you know as soon as you're in - check back soon.</p>
      <form method="POST" action="{{ url_for('coach_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn secondary" type="submit" style="width:100%;">Log Out</button>
      </form>
    </div>
  </div>
</body>
</html>
